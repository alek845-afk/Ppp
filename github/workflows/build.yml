name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract source
        run: |
          unzip -o SluzhbaKorony-Forge-1.12.2-source-fixed.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build JAR
        run: |
          cd project
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SluzhbaKorony-JAR
          path: project/build/libs/*.jar
